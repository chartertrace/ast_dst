name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: Go (extractor)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.21", "stable"]
    defaults:
      run:
        working-directory: golang
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...

  tla:
    name: TLA+ verification (SANY + TLC integration)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: golang
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: cache tla2tools.jar
        # Keyed on fetch-jar.sh, so the cache auto-invalidates when the pinned
        # version/sha changes; otherwise the 4MB jar is reused across runs.
        uses: actions/cache@v4
        with:
          path: ~/.cache/ast_dst
          key: tla2tools-${{ hashFiles('scripts/fetch-jar.sh') }}
      - name: fetch tla2tools.jar (pinned + checksum)
        run: echo "TLA2TOOLS_JAR=$(../scripts/fetch-jar.sh)" >> "$GITHUB_ENV"
      - name: gen integration tests (un-skipped)
        # Without java + $TLA2TOOLS_JAR these tests t.Skip, so the headline
        # "verify with real SANY/TLC" guarantee is otherwise never exercised in
        # CI. With both present they run for real; -count=1 disables caching.
        run: go test ./gen/... -count=1 -v

  typescript:
    name: TypeScript (viewer + generators)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: install deps
        run: npm install
      - name: lint (accessibility + react-hooks)
        run: npm run lint
      - name: typecheck
        run: npm run typecheck
      - name: test
        run: npm test
      - name: spec↔Go drift gate (Stage 1)
        # Fails only on a runtime gap: a model-checked TLA+ invariant with no Go
        # checker. Gates the committed sample model against the sharpest drift.
        run: npm run gen:reconcile -- --in sample/model.json --strict
