name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: Go (extractor)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.21", "stable"]
    defaults:
      run:
        working-directory: golang
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...

  typescript:
    name: TypeScript (viewer + generators)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: install deps
        run: npm install
      - name: typecheck
        run: npm run typecheck
      - name: test
        run: npm test
      - name: spec↔Go drift gate (Stage 1)
        # Fails only on a runtime gap: a model-checked TLA+ invariant with no Go
        # checker. Gates the committed sample model against the sharpest drift.
        run: npm run gen:reconcile -- --in sample/model.json --strict
